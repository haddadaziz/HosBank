services:
  db:
    image: postgres:16-alpine
    container_name: hosbank-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hosbank

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hosbank"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: hosbank-app
    restart: unless-stopped

    command: sh -c "node database/init.js && npm run dev"
    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      NODE_ENV: development
      SESSION_SECRET: hosbank-dev-session-secret-key-2026
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: hosbank
      SMTP_HOST: sandbox.smtp.mailtrap.io
      SMTP_PORT: 2525
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    name: hosbank_postgres_data