<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D3554" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3D3554" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="250" cy="320" rx="200" ry="18" fill="#4B4165" opacity="0.6"/>

  <!-- Character 1 (Left - Woman in white blouse and violet skirt) -->
  <g id="char1" transform="translate(60, 40)">
    <!-- Legs -->
    <rect x="52" y="160" width="7" height="85" rx="3.5" fill="#8C6A5A"/>
    <rect x="68" y="160" width="7" height="85" rx="3.5" fill="#8C6A5A"/>
    <ellipse cx="55" cy="245" rx="9" ry="5" fill="#252033"/>
    <ellipse cx="71" cy="245" rx="9" ry="5" fill="#252033"/>
    <!-- Skirt -->
    <path d="M44 125 L84 125 L92 165 L36 165 Z" fill="#8B6B7B" rx="3"/>
    <!-- Torso / Blouse -->
    <path d="M46 88 L82 88 L85 125 L43 125 Z" fill="#FFFFFF"/>
    <path d="M56 88 L64 105 L72 88 Z" fill="#E8A598"/>
    <!-- Arms -->
    <path d="M45 90 L34 125 L41 127 L49 98 Z" fill="#FFFFFF"/>
    <path d="M83 90 L94 125 L87 127 L79 98 Z" fill="#FFFFFF"/>
    <!-- Head -->
    <ellipse cx="64" cy="65" rx="14" ry="16" fill="#C68670"/>
    <!-- Hair bun -->
    <ellipse cx="64" cy="52" rx="16" ry="13" fill="#2E2320"/>
    <ellipse cx="64" cy="40" rx="8" ry="8" fill="#2E2320"/>
    <!-- Smile -->
    <path d="M60 70 Q64 74 68 70" stroke="#523225" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="59" cy="64" r="1.8" fill="#2E2320"/>
    <circle cx="69" cy="64" r="1.8" fill="#2E2320"/>
  </g>

  <!-- Character 2 (Center-Left - Smiling Man with White Shirt waving) -->
  <g id="char2" transform="translate(145, 10)">
    <!-- Legs / Trousers -->
    <rect x="52" y="150" width="11" height="125" rx="4" fill="#3D4A59"/>
    <rect x="74" y="150" width="11" height="125" rx="4" fill="#3D4A59"/>
    <ellipse cx="57" cy="275" rx="12" ry="6" fill="#252033"/>
    <ellipse cx="79" cy="275" rx="12" ry="6" fill="#252033"/>
    <!-- Torso / Shirt -->
    <path d="M42 80 L94 80 L98 152 L38 152 Z" fill="#FFFFFF" rx="4"/>
    <path d="M58 80 L68 100 L78 80 Z" fill="#C28972"/>
    <!-- Left Hand hanging -->
    <path d="M40 85 L28 140 L37 142 L46 95 Z" fill="#FFFFFF"/>
    <!-- Right Arm waving -->
    <path d="M94 85 L112 40 L121 45 L102 92 Z" fill="#FFFFFF"/>
    <ellipse cx="116" cy="35" rx="7" ry="7" fill="#C28972"/>
    <!-- Head -->
    <ellipse cx="68" cy="52" rx="16" ry="18" fill="#C28972"/>
    <!-- Hair -->
    <path d="M52 48 Q68 32 84 48 Q78 36 68 36 Q58 36 52 48 Z" fill="#252033"/>
    <!-- Face -->
    <circle cx="63" cy="51" r="2" fill="#252033"/>
    <circle cx="74" cy="51" r="2" fill="#252033"/>
    <path d="M62 58 Q68 64 74 58" stroke="#523225" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Character 3 (Center-Right - Young person with arm raised) -->
  <g id="char3" transform="translate(245, 30)">
    <!-- Legs -->
    <rect x="42" y="145" width="9" height="115" rx="3.5" fill="#7A5666"/>
    <rect x="58" y="145" width="9" height="115" rx="3.5" fill="#7A5666"/>
    <ellipse cx="46" cy="260" rx="10" ry="5.5" fill="#252033"/>
    <ellipse cx="62" cy="260" rx="10" ry="5.5" fill="#252033"/>
    <!-- Torso -->
    <rect x="36" y="85" width="37" height="62" rx="4" fill="#384351"/>
    <!-- Raised arm -->
    <path d="M37 90 L24 45 L32 42 L44 88 Z" fill="#384351"/>
    <ellipse cx="23" cy="40" rx="6" ry="6" fill="#8A6353"/>
    <!-- Hanging arm -->
    <path d="M72 90 L80 135 L73 137 L67 95 Z" fill="#384351"/>
    <!-- Head -->
    <ellipse cx="54" cy="62" rx="14" ry="16" fill="#8A6353"/>
    <!-- Hair -->
    <path d="M40 58 Q54 44 68 58 Q62 48 54 48 Q46 48 40 58 Z" fill="#1C1824"/>
    <!-- Eyes and smile -->
    <circle cx="50" cy="61" r="1.8" fill="#1C1824"/>
    <circle cx="59" cy="61" r="1.8" fill="#1C1824"/>
    <path d="M49 68 Q54 72 60 68" stroke="#422E26" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Character 4 (Right - Confident man in peach/pink tee, hands on hips) -->
  <g id="char4" transform="translate(325, 15)">
    <!-- Legs -->
    <rect x="42" y="148" width="11" height="125" rx="4" fill="#2D3A4B"/>
    <rect x="68" y="148" width="11" height="125" rx="4" fill="#2D3A4B"/>
    <ellipse cx="47" cy="272" rx="12" ry="6" fill="#252033"/>
    <ellipse cx="73" cy="272" rx="12" ry="6" fill="#252033"/>
    <!-- Torso / Peach T-shirt -->
    <path d="M34 82 L86 82 L88 150 L32 150 Z" fill="#F4BDB0" rx="4"/>
    <path d="M50 82 L60 96 L70 82 Z" fill="#B87D65"/>
    <!-- Arms hands on hips -->
    <path d="M34 84 L14 118 L24 122 L40 94 Z" fill="#F4BDB0"/>
    <path d="M86 84 L106 118 L96 122 L80 94 Z" fill="#F4BDB0"/>
    <!-- Head -->
    <ellipse cx="60" cy="54" rx="15" ry="17" fill="#B87D65"/>
    <!-- Hair -->
    <path d="M45 50 Q60 36 75 50 Q70 38 60 38 Q50 38 45 50 Z" fill="#1E1926"/>
    <!-- Face -->
    <circle cx="55" cy="53" r="2" fill="#1E1926"/>
    <circle cx="66" cy="53" r="2" fill="#1E1926"/>
    <path d="M54 61 Q60 66 67 61" stroke="#482F24" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
